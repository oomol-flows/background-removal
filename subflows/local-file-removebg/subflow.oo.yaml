nodes:
  - node_id: background-remove#1
    title: "%background-remove-12%"
    description: "%ai-powered-background-removal-processor-that-takes-the-uploaded2%"
    inputs_from:
      - handle: image_url
        from_node:
          - node_id: upload-to-cloud#1
            output_handle: cache_url
      - handle: output_file
        value: null
        from_flow:
          - input_handle: output_file
    task: self::url-file-removebg
  - node_id: upload-to-cloud#1
    title: "%upload-file-to-cloud-1%"
    description: "%uploads-your-local-image-file-to-the-cloud-storage-and-generates%"
    inputs_from:
      - handle: file
        from_flow:
          - input_handle: file
    task: upload-to-cloud::upload-to-cloud
title: "%local-file-removebg%"
inputs_def:
  - handle: file
    description: "%select-an-image-file-from-your-computer-that-you-want-to-remove%"
    json_schema:
      type: string
      ui:widget: file
    nullable: false
    executor_name: nodejs
  - handle: output_file
    description: "%optional-file-path-where-the-processed-image-will-be-saved-if-no2%"
    json_schema:
      type: string
      ui:widget: save
    value:
    nullable: true
    executor_name: python
outputs_def:
  - handle: image
    description: "The processed image file with background completely removed and
      transparent background applied. Ready for use in presentations, designs,
      or further editing."
    json_schema:
      type: string
      contentMediaType: oomol/file
    nullable: false
    executor_name: python
outputs_from:
  - handle: image
    from_node:
      - node_id: background-remove#1
        output_handle: image
private: false
description: "%complete-background-removal-workflow-for-local-image-files-this2%"
