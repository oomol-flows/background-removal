inputs_def:
  - handle: image_url
    description: "%image-url-to-process-for-background-removal%"
    json_schema:
      type: string
    nullable: false
  - handle: output_file
    description: "%optional-file-path-where-the-processed-image-will-be-saved-if-no%"
    json_schema:
      type: string
      ui:widget: save
    value:
    nullable: true
outputs_def:
  - handle: image
    description: "The processed image file with background removed. Returns the file
      path to the image with transparent background, ready for use in other
      applications or workflows."
    json_schema:
      type: string
      contentMediaType: oomol/file

executor:
  name: python
  options:
    entry: __init__.py
    spawn: false

title: "%url-file-removebg%"
description: "%ai-powered-background-removal-tool-that-processes-images-from-ur2%"
icon: ":carbon:url:"
private: false
